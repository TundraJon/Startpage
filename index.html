<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TundraJon</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f5;
    --fg: #1a1a1a;
    --accent: #1A5276;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14181c; --fg: #e8e8e8; --accent: #5dade2; }
  }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-align: center;
  }
  main {
    padding: 2rem;
  }
  h1 {
    font-size: 2rem;
    margin-bottom: 0.5rem;
    color: var(--accent);
  }
  p {
    font-size: 1.1rem;
    opacity: 0.8;
  }
</style>
</head>
<body>
<main>
  <h1>It's live.</h1>
  <p>Personal homepage — coming soon.</p>
</main>
</body>
</html>
